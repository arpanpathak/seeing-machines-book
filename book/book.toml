[book]
title = "Seeing Machines: Deep Learning & Computer Vision from Python to Bare Metal"
authors = ["Arpan Pathak"]
language = "en"
description = "Building Production-Grade Vision Systems with Typed Python and Idiomatic Rust. A comprehensive, no-fluff guide to building real-world computer vision systems. Train models with typed Python, deploy with high-performance Rust on edge devices — all wrapped around the CivicSense capstone project."

[output.html]
mathjax-support = true
no-section-label = true
site-url = "https://arpanpathak.github.io/seeing-machines-book/"
git-repository-url = "https://github.com/arpanpathak/seeing-machines-book"
edit-url-template = "https://github.com/arpanpathak/seeing-machines-book/edit/main/book/src/{path}"

[output.html.print]
enable = true
